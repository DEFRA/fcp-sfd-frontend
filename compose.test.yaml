services:
  fcp-sfd-frontend:
    build:
      target: development
    image: fcp-sfd-frontend-development
    container_name: fcp-sfd-frontend-test
    command: npm run test
    env_file:
      - path: .env
        required: false
    environment:
      ALLOW_ERROR_VIEWS: false
      AWS_EMF_ENVIRONMENT: Local
      DAL_ENDPOINT: http://fcp-dal-api:3005/graphql
      DEFRA_ID_WELL_KNOWN_URL: https://accounts.test.com/.well-known/openid-configuration
      DEFRA_ID_CLIENT_ID: test-client-id
      DEFRA_ID_CLIENT_SECRET: test-client-secret
      DEFRA_ID_SERVICE_ID: test-service-id
      DEFRA_ID_POLICY: test-policy
      PERSONAL_DETAILS_INTERRUPTER_ENABLED: false
      BUSINESS_DETAILS_INTERRUPTER_ENABLED: false
      UPDATE_PERSONAL_DETAILS: ${UPDATE_PERSONAL_DETAILS:-true}
      UPDATE_PERSONAL_DETAILS_NAME: ${UPDATE_PERSONAL_DETAILS_NAME:-true}
      UPDATE_PERSONAL_DETAILS_DOB: ${UPDATE_PERSONAL_DETAILS_DOB:-true}
      UPDATE_PERSONAL_DETAILS_ADDRESS: ${UPDATE_PERSONAL_DETAILS_ADDRESS:-true}
      UPDATE_PERSONAL_DETAILS_PHONE: ${UPDATE_PERSONAL_DETAILS_PHONE:-true}
      UPDATE_PERSONAL_DETAILS_EMAIL: ${UPDATE_PERSONAL_DETAILS_EMAIL:-true}
      UPDATE_BUSINESS_DETAILS: ${UPDATE_BUSINESS_DETAILS:-true}
      UPDATE_BUSINESS_DETAILS_NAME: ${UPDATE_BUSINESS_DETAILS_NAME:-true}
      UPDATE_BUSINESS_DETAILS_ADDRESS: ${UPDATE_BUSINESS_DETAILS_ADDRESS:-true}
      UPDATE_BUSINESS_DETAILS_PHONE: ${UPDATE_BUSINESS_DETAILS_PHONE:-true}
      UPDATE_BUSINESS_DETAILS_EMAIL: ${UPDATE_BUSINESS_DETAILS_EMAIL:-true}
      UPDATE_BUSINESS_DETAILS_VAT: ${UPDATE_BUSINESS_DETAILS_VAT:-true}
      UPDATE_BUSINESS_DETAILS_CHARITY_REGISTRATION: ${UPDATE_BUSINESS_DETAILS_CHARITY_REGISTRATION:-true}
      UPDATE_BUSINESS_DETAILS_COMPANY_REGISTRATION: ${UPDATE_BUSINESS_DETAILS_COMPANY_REGISTRATION:-true}
      CPH_ENABLED: false
      WATER_MANAGEMENT_ENABLED: true
      WATER_MANAGEMENT_ENDPOINT: https://grants-ui.test.cdp-int.defra.cloud/water-management
      WMP_ENDPOINT: https://grants-ui.test.cdp-int.defra.cloud/woodland
      VIEW_LAND_ENABLED: ${VIEW_LAND_ENABLED:-false}
    depends_on:
      fcp-dal-api:
        condition: service_started
      upstream-mock:
        condition: service_healthy
    volumes:
      - ./src/:/home/node/src
      - ./test/:/home/node/test
      - ./package.json:/home/node/package.json
      - ./coverage:/home/node/coverage
